{% macro cart_action(shirt, compact=false) %}
{% if can_purchase(shirt) %}
<form method="post" action="{{ url_for('payments.cart_add', shirt_id=shirt.id) }}" class="cart-add-form {{ 'cart-add-form--card' if compact else 'cart-add-form--product' }}" data-cart-add>
<input type="hidden" name="csrf_token" value="{{ payment_csrf_token() }}">
<button type="submit" class="cart-add {{ 'cart-add--card' if compact else 'cart-add--product' }}" aria-label="{{ ('Aggiungi al carrello: ' if session.get('lang') == 'it' else 'Add to cart: ') ~ (shirt|display_name_localized) }}" title="{{ 'Aggiungi al carrello' if session.get('lang') == 'it' else 'Add to cart' }}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg><span data-cart-label>{{ ('Nel carrello' if shirt.id in cart_ids else 'Aggiungi al carrello') if session.get('lang') == 'it' else ('In your cart' if shirt.id in cart_ids else 'Add to cart') }}</span><span class="cart-add__plus" aria-hidden="true">{{ '✓' if shirt.id in cart_ids else '+' }}</span>
</button>
</form>
{% endif %}
{% endmacro %}
