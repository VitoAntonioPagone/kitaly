{% macro cart_action(shirt, compact=false) %}
{% if can_purchase(shirt) %}
{% set kitbag_it = storefront_locale == 'it' %}
<form method="post" action="{{ url_for('payments.cart_add', shirt_id=shirt.id, lang='it' if kitbag_it else none) }}" class="cart-add-form {{ 'cart-add-form--card' if compact else 'cart-add-form--product' }}" data-cart-add>
<input type="hidden" name="csrf_token" value="{{ payment_csrf_token() }}">
<button type="submit" class="cart-add {{ 'cart-add--card' if compact else 'cart-add--product' }}" aria-label="{{ ('Aggiungi al borsone: ' if kitbag_it else 'Add to kitbag: ') ~ (shirt|display_name_localized) }}" title="{{ 'Aggiungi al borsone' if kitbag_it else 'Add to kitbag' }}">
{% include "components/kitbag_icon.html" %}<span data-cart-label>{{ ('Nel borsone' if shirt.id in cart_ids else 'Aggiungi al borsone') if kitbag_it else ('In your kitbag' if shirt.id in cart_ids else 'Add to kitbag') }}</span><span class="cart-add__plus" aria-hidden="true">{{ '✓' if shirt.id in cart_ids else '+' }}</span>
</button>
</form>
{% endif %}
{% endmacro %}
