{% from "components/theme_choices.html" import theme_choices %}
<nav id="main-nav" class="header-glass club-rail" aria-label="Kitaly">
    <div class="club-rail__crest">
        <div class="club-rail__top">
            <div class="header-left-tools">
                <button type="button" class="mobile-menu-trigger" id="mobile-menu-trigger" aria-label="{{ 'Apri menu' if storefront_locale == 'it' else 'Open menu' }}" aria-haspopup="dialog" aria-controls="mobile-menu" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg><span>Menu</span>
                </button>
                {% if request.endpoint == 'public.catalog' %}
                <div class="kitaly-header-tools">
                    <button type="button" id="header-filters" aria-expanded="false" aria-controls="catalog-filters-panel" aria-label="{{ _('Filters') }}" class="text-slate-600"><i data-lucide="sliders-horizontal" class="w-5 h-5"></i></button>
                </div>
                {% endif %}
            </div>
            <div class="kitaly-header-brand">
                <a href="{{ url_for('public.catalog') }}" class="group kitaly-logo" aria-label="Kitaly">
                    <img src="{{ url_for('static', filename='images/masthead-light.png', v='20261118-logos') }}" alt="" class="brand-light" width="448" height="232">
                    <img src="{{ url_for('static', filename='images/masthead-dark.png', v='20261118-logos') }}" alt="" class="brand-dark" width="448" height="232">
                </a>
            </div>
            <div class="header-shop-tools">
                <a href="{{ url_for('payments.cart', lang='it' if storefront_locale == 'it' else none) }}" class="header-cart" aria-label="{{ 'Borsone' if storefront_locale == 'it' else 'Kitbag' }}">{% include "components/kitbag_icon.html" %}<span data-cart-count {% if not cart_count %}hidden{% endif %}>{{ cart_count }}</span></a>
                <div class="kitaly-header-language" aria-label="{{ 'Lingua' if storefront_locale == 'it' else 'Language' }}">
                    <a href="{{ language_url('en') }}" lang="en" aria-label="English" {% if storefront_locale != 'it' %}aria-current="true"{% endif %}>EN</a>
                    <span aria-hidden="true"></span>
                    <a href="{{ language_url('it') }}" lang="it" aria-label="Italiano" {% if storefront_locale == 'it' %}aria-current="true"{% endif %}>IT</a>
                </div>
                {{ theme_choices("header-theme", storefront_locale == "it") }}
            </div>
        </div>
    </div>
</nav>
