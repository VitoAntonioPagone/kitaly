<nav id="main-nav" class="header-glass club-rail" aria-label="Kitaly">
    <div class="club-rail__crest">
        <div class="club-rail__top">
                <div class="kitaly-header-tools">
                    {% if request.endpoint == 'public.catalog' %}
                    <button type="button" id="header-filters" aria-controls="catalog-filters-panel" aria-label="{{ _('Filters') }}" class="text-slate-600"><i data-lucide="sliders-horizontal" class="w-5 h-5"></i></button>
                    {% endif %}
                    <button id="theme-toggle" type="button" role="switch" aria-checked="false"
                        aria-label="Toggle dark mode" title="Toggle dark mode" class="theme-toggle">
                        <span class="theme-toggle-track" aria-hidden="true">
                            <svg class="theme-toggle-icon theme-toggle-sun" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path
                                    d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41">
                                </path>
                            </svg>
                            <svg class="theme-toggle-icon theme-toggle-moon" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.5 3.2a8.9 8.9 0 1 0 6.3 12.5 7.3 7.3 0 0 1-6.3-12.5Z"></path>
                            </svg>
                        </span>
                        <span class="theme-toggle-thumb" aria-hidden="true"></span>
                    </button>

                </div>
                <div class="kitaly-header-brand">
                    <a href="{{ url_for('public.catalog') }}" class="group kitaly-logo" aria-label="Kitaly">
                        <img src="{{ url_for('static', filename='images/brand-light.png', v='20261031') }}" alt="" class="brand-light" width="1024" height="720">
                        <img src="{{ url_for('static', filename='images/brand-dark.png', v='20261031') }}" alt="" class="brand-dark" width="1024" height="720">
                    </a>
                </div>
            <div class="kitaly-header-language" aria-label="{{ 'Lingua' if session.get('lang') == 'it' else 'Language' }}">
                <a href="{{ language_url('en') }}" lang="en" aria-label="English" {% if session.get('lang') != 'it' %}aria-current="true"{% endif %}>EN</a>
                <span aria-hidden="true"></span>
                <a href="{{ language_url('it') }}" lang="it" aria-label="Italiano" {% if session.get('lang') == 'it' %}aria-current="true"{% endif %}>IT</a>
            </div>
        </div>
    </div>
    <div class="club-rail__bar">
        <div class="club-rail__inner">
            <div class="kitaly-page-menu" role="navigation" aria-label="{{ 'Menu principale' if session.get('lang') == 'it' else 'Main menu' }}">
                <a href="{{ url_for('public.catalog') }}" {% if request.endpoint == 'public.catalog' %}aria-current="page"{% endif %}>The Stock</a>
            </div>
        </div>
    </div>
</nav>
