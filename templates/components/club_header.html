<nav id="main-nav" class="header-glass club-rail" aria-label="Kitaly">
    <div class="club-rail__crest">
        <div class="club-rail__top">
            <div class="header-left-tools">
                <button type="button" class="mobile-menu-trigger" id="mobile-menu-trigger" aria-label="{{ 'Apri menu' if session.get('lang') == 'it' else 'Open menu' }}" aria-haspopup="dialog" aria-controls="mobile-menu" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menu</span>
                </button>
                <div class="kitaly-header-tools">
                    {% if request.endpoint == 'public.catalog' %}
                    <button type="button" id="header-filters" aria-expanded="false" aria-controls="catalog-filters-panel" aria-label="{{ _('Filters') }}" class="text-slate-600"><i data-lucide="sliders-horizontal" class="w-5 h-5"></i></button>
                    {% endif %}
                    <button id="theme-toggle" type="button" role="switch" aria-checked="false"
                        aria-label="Toggle dark mode" title="Toggle dark mode" class="theme-toggle">
                        <span class="theme-toggle-track" aria-hidden="true">
                            <svg class="theme-toggle-icon theme-toggle-sun" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path
                                    d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41">
                                </path>
                            </svg>
                            <svg class="theme-toggle-icon theme-toggle-moon" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.5 3.2a8.9 8.9 0 1 0 6.3 12.5 7.3 7.3 0 0 1-6.3-12.5Z"></path>
                            </svg>
                        </span>
                        <span class="theme-toggle-thumb" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
            <div class="kitaly-header-brand">
                <a href="{{ url_for('public.catalog') }}" class="group kitaly-logo" aria-label="Kitaly">
                    <img src="{{ url_for('static', filename='images/masthead-light.png', v='20261118-logos') }}" alt="" class="brand-light" width="448" height="232">
                    <img src="{{ url_for('static', filename='images/masthead-dark.png', v='20261118-logos') }}" alt="" class="brand-dark" width="448" height="232">
                </a>
            </div>
            <div class="header-shop-tools">
                <a href="{{ url_for('payments.cart') }}" class="header-cart" aria-label="{{ 'Carrello' if session.get('lang') == 'it' else 'Shopping cart' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg><span data-cart-count {% if not cart_count %}hidden{% endif %}>{{ cart_count }}</span></a>
                <div class="kitaly-header-language" aria-label="{{ 'Lingua' if session.get('lang') == 'it' else 'Language' }}">
                    <a href="{{ language_url('en') }}" lang="en" aria-label="English" {% if session.get('lang') != 'it' %}aria-current="true"{% endif %}>EN</a>
                    <span aria-hidden="true"></span>
                    <a href="{{ language_url('it') }}" lang="it" aria-label="Italiano" {% if session.get('lang') == 'it' %}aria-current="true"{% endif %}>IT</a>
                </div>
            </div>
        </div>
    </div>
</nav>
